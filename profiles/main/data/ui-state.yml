  I'll modify the script to accept a command-line argument for the \\\"time\\\"
  parameter. Here's how we can update it using
  argparse:\\n\\n```python:d:\\\\Downloads\\\\get_era5.py\\nimport
  cdsapi\\nimport argparse\\n\\n# Add argument parser\\nparser =
  argparse.ArgumentParser(description='Download ERA5 data for a specific
  time')\\nparser.add_argument('--time', type=str,
  default=\\\"00:00\\\",\\n                   help='Time in format HH:MM
  (default: 00:00)')\\n\\nargs = parser.parse_args()\\n\\ndataset =
  \\\"reanalysis-era5-pressure-levels\\\"\\nrequest =
  {\\n    \\\"product_type\\\": [\\\"reanalysis\\\"],\\n    \\\"variable\\\":
  [\\n        \\\"divergence\\\",\\n        \\\"fraction_of_cloud_cover\\\",\\n        \
  \\\"geopotential\\\",\\n        # ... existing variables
  ...\\n    ],\\n    \\\"year\\\": [\\\"2018\\\"],\\n    \\\"month\\\":
  [\\\"08\\\"],\\n    \\\"day\\\": [\\\"09\\\"],\\n    \\\"time\\\":
  [args.time],  # Modified to use command-line
  argument\\n    \\\"pressure_level\\\": [\\n        # ... existing pressure
  levels ...\\n    ],\\n    \\\"data_format\\\":
  \\\"grib\\\",\\n    \\\"download_format\\\":
  \\\"unarchived\\\",\\n    \\\"area\\\": [65, -25, 10, 60]\\n}\\n\\nclient =
  cdsapi.Client()\\nclient.retrieve(dataset, request).download()\\n```\\n\\nThe
  main changes are:\\n1. Added `import argparse` at the top\\n2. Added an
  argument parser that accepts a `--time` parameter\\n3. Modified the
  `\\\"time\\\"` field in the request dictionary to use the provided
  argument\\n\\nNow you can run the script with a specific time like
  this:\\n```bash\\npython get_era5.py --time \\\"12:00\\\"\\n```\\n\\nIf no
  time is specified, it will default to \\\"00:00\\\". The time should be
  provided in \\\"HH:MM\\\"
